name: Build TorrServer Bunny image
on:
  push:
    branches: [master]
    paths:
      - Dockerfile.bunny
      - bunny/gateway.go
      - bunny/entrypoint.sh
      - .github/workflows/build-bunny-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push x86_64 container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bunny
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vbrekher/torrserver-bunny:main
